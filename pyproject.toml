[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "content-planning-agent"
version = "0.1.0"
description = "Content campaign planning with OpenAI-compatible APIs and an explicit offline driver"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "python-dotenv>=1.2,<2"]

[project.scripts]
content-planner = "content_planner.cli:main"

[tool.setuptools]
packages = ["content_planner", "content_planner.data"]
include-package-data = true

[tool.setuptools.package-dir]
content_planner = "src/content_planner"
"content_planner.data" = "data"

[tool.setuptools.package-data]
"content_planner.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
